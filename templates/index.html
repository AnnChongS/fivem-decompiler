<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FiveM FXAP Decompiler</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0a0f;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container {
  width: 100%;
  max-width: 480px;
  padding: 20px;
}
.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 32px;
  backdrop-filter: blur(20px);
}
h1 {
  font-size: 22px;
  font-weight: 600;
  text-align: center;
  margin-bottom: 6px;
  background: linear-gradient(135deg, #6366f1, #a855f7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.subtitle {
  text-align: center;
  color: #666;
  font-size: 13px;
  margin-bottom: 28px;
}
label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #999;
  margin-bottom: 6px;
}
input[type="text"], input[type="file"] {
  width: 100%;
  padding: 10px 14px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  color: #e0e0e0;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
input:focus {
  border-color: #6366f1;
}
input[type="file"] {
  cursor: pointer;
  padding: 12px 14px;
}
input[type="file"]::file-selector-button {
  background: rgba(99,102,241,0.2);
  border: 1px solid rgba(99,102,241,0.3);
  border-radius: 6px;
  color: #a5b4fc;
  padding: 6px 12px;
  margin-right: 10px;
  cursor: pointer;
  font-size: 13px;
}
.btn {
  width: 100%;
  padding: 12px;
  margin-top: 20px;
  background: linear-gradient(135deg, #6366f1, #7c3aed);
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.9; }
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.field { margin-bottom: 16px; }
.status {
  margin-top: 20px;
  padding: 14px;
  border-radius: 10px;
  font-size: 13px;
  display: none;
  text-align: center;
}
.status.processing {
  display: block;
  background: rgba(99,102,241,0.1);
  border: 1px solid rgba(99,102,241,0.2);
  color: #a5b4fc;
}
.status.error {
  display: block;
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.2);
  color: #fca5a5;
}
.status.done {
  display: block;
  background: rgba(34,197,94,0.1);
  border: 1px solid rgba(34,197,94,0.2);
  color: #86efac;
}
.status.done a {
  color: #86efac;
  font-weight: 600;
}
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(165,180,252,0.3);
  border-top-color: #a5b4fc;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>🔓 FiveM FXAP Decompiler</h1>
    <p class="subtitle">Upload encrypted .pack.zip + license key → get decompiled Lua</p>

    <form id="form" enctype="multipart/form-data">
      <div class="field">
        <label>Encrypted Resource (.zip)</label>
        <input type="file" name="file" id="file" accept=".zip" required>
      </div>
      <div class="field">
        <label>FiveM License Key</label>
        <input type="text" name="license_key" id="key" placeholder="cfxk_xxxxxxxxxxxx" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">Decompile</button>
    </form>

    <div class="status" id="status"></div>
  </div>
</div>

<script>
const form = document.getElementById('form');
const status = document.getElementById('status');
const btn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(form);
  btn.disabled = true;
  status.className = 'status processing';
  status.innerHTML = '<span class="spinner"></span> Uploading...';

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.error) {
      status.className = 'status error';
      status.textContent = data.error;
      btn.disabled = false;
      return;
    }

    // Poll for status
    const poll = setInterval(async () => {
      const r = await fetch(`/api/status/${data.job_id}`);
      const j = await r.json();

      if (j.status === 'processing') {
        status.innerHTML = `<span class="spinner"></span> ${j.progress}`;
      } else if (j.status === 'done') {
        clearInterval(poll);
        status.className = 'status done';
        status.innerHTML = `✅ ${j.progress}<br><a href="/api/download/${data.job_id}">⬇ Download Result</a>`;
        btn.disabled = false;
      } else if (j.status === 'error') {
        clearInterval(poll);
        status.className = 'status error';
        status.textContent = j.error || j.progress;
        btn.disabled = false;
      }
    }, 2000);
  } catch (err) {
    status.className = 'status error';
    status.textContent = 'Network error';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
